<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Calculadora de Notas</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&display=swap');

  :root{
    --bg: #a9772f;
    --card: #f4e8d3;
    --line: #c2a26b;
    --ink: #2c1c0f;
    --ink-soft: #6b5133;
    --accent: #8a3324;
    --pass: #2f6b3f;
    --pass-bg: #dbe9d9;
    --fail: #a53324;
    --fail-bg: #f3dcd6;
    --warn: #8a5f14;
    --warn-bg: #f0e0b8;
    --neutro: #e4d3b0;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  body{
    margin:0;
    background-color: var(--bg);
    background-image:
      repeating-linear-gradient(90deg,
        rgba(255,255,255,0.05) 0px, rgba(255,255,255,0.05) 2px,
        transparent 2px, transparent 7px),
      repeating-linear-gradient(90deg,
        rgba(60,32,10,0.10) 0px, rgba(60,32,10,0.10) 1px,
        transparent 1px, transparent 90px, rgba(60,32,10,0.06) 91px, transparent 92px),
      linear-gradient(180deg, #b1802f 0%, #a9772f 50%, #9c6f2b 100%);
    font-family:'JetBrains Mono', monospace;
    color: var(--ink);
    padding: 22px 16px 60px 16px;
    min-height:100vh;
  }

  .tag{
    display:inline-block;
    font-size:10px;
    letter-spacing:.14em;
    color: #3a2410;
    background: rgba(255,255,255,0.35);
    border: 1px solid rgba(44,28,15,0.35);
    padding: 3px 9px;
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  h1{
    font-weight:800;
    font-size:26px;
    letter-spacing: -0.01em;
    margin: 0 0 2px 0;
    text-transform: uppercase;
    color: #241708;
    text-shadow: 0 1px 0 rgba(255,255,255,0.2);
  }
  .subtitle{ font-size:11px; color: #4a3418; margin-bottom:20px; letter-spacing:.03em; }

  .add-materia{ display:flex; gap:8px; margin-bottom:20px; }
  input[type=text], input[type=number]{
    font-family:'JetBrains Mono', monospace; border:1.5px solid var(--line);
    border-radius:3px; padding:11px 12px; font-size:14px; background:#fdf7ea;
    color:var(--ink); outline:none; width:100%;
  }
  input::placeholder{ color: #a68b5f; }
  input:focus{ border-color: var(--accent); }
  .add-materia input{ flex:1; }
  button{
    font-family:'JetBrains Mono', monospace; font-weight:700; border:1.5px solid #5c2a1c;
    border-radius:3px; padding:11px 16px; font-size:12px; cursor:pointer;
    background: var(--accent); color:#fdf1e4; text-transform:uppercase; letter-spacing:.04em;
  }
  button:active{ transform: translateY(1px); }
  .icon-btn{ background:transparent; border:none; color:#5c4326; font-size:11px; text-decoration:underline; padding:0; text-transform:none; letter-spacing:0; }

  .materia{
    background:var(--card); border:1.5px solid var(--line); border-radius:4px;
    padding:16px; margin-bottom:16px;
    box-shadow: 0 2px 6px rgba(40,24,8,0.18);
  }
  .materia-header{
    display:flex; justify-content:space-between; align-items:baseline; margin-bottom:12px;
    border-bottom: 1px solid var(--line); padding-bottom:10px;
  }
  .materia-nome{ font-size:16px; font-weight:800; text-transform:uppercase; letter-spacing:.03em; }

  .meta-row{ display:flex; align-items:center; gap:8px; font-size:10px; color:var(--ink-soft); margin-bottom:12px; text-transform:uppercase; letter-spacing:.05em; }
  .meta-row input{ width:60px; padding:6px 7px; font-size:12px; }

  table{ width:100%; border-collapse:collapse; margin-bottom:12px; font-size:12px; }
  th{ text-align:left; color:var(--ink-soft); font-weight:400; font-size:9px; text-transform:uppercase; letter-spacing:.06em; padding-bottom:6px; border-bottom:1px solid var(--line); }
  td{ padding:7px 4px; border-bottom:1px solid var(--line); vertical-align:middle; }
  td.nome-col{ width:38%; }
  td.peso-col, td.nota-col{ width:20%; color: var(--ink-soft); }
  td.nota-col{ color: var(--ink); font-weight:700; }
  td.acao-col{ width:10%; text-align:right; }
  .remover{ color:var(--fail); font-weight:700; cursor:pointer; font-size:15px; }

  .add-avaliacao{ display:flex; gap:6px; margin-bottom:12px; }
  .add-avaliacao input:nth-child(1){ flex:1.6; }
  .add-avaliacao input:nth-child(2){ width:52px; }
  .add-avaliacao input:nth-child(3){ width:58px; }
  .add-avaliacao button{ padding:9px 12px; font-size:14px; }

  .resultado{ display:flex; gap:8px; flex-wrap:wrap; }
  .pill{ flex:1; min-width:120px; border-radius:2px; padding:10px 12px; border:1px solid var(--line); }
  .pill-label{ font-size:9px; text-transform:uppercase; letter-spacing:.07em; opacity:.8; margin-bottom:3px; }
  .pill-valor{ font-size:19px; font-weight:800; }
  .pill.ok{ background:var(--pass-bg); color:var(--pass); border-color:var(--pass); }
  .pill.no{ background:var(--fail-bg); color:var(--fail); border-color:var(--fail); }
  .pill.neutro{ background:var(--neutro); color:var(--ink-soft); }
  .pill.warn{ background:var(--warn-bg); color:var(--warn); border-color:var(--warn); }

  .del-materia{ margin-top:12px; }
  .vazio{ text-align:center; color:var(--ink-soft); font-size:13px; padding:36px 10px; border:1px dashed var(--line); border-radius:3px; }
  .hint{ font-size:10px; color:var(--ink-soft); margin-top:4px; margin-bottom:10px; }
</style>
</head>
<body>

  <div class="tag">Boletim &middot; Operação Etapa</div>
  <h1>Calculadora de Notas</h1>
  <div class="subtitle">média ponderada / nota necessária pra bater a meta</div>

  <div class="add-materia">
    <input type="text" id="novaMateria" placeholder="Nome da matéria">
    <button onclick="adicionarMateria()">Add</button>
  </div>

  <div id="lista"></div>
  <div id="vazioMsg" class="vazio" style="display:none;">
    Nenhuma matéria cadastrada. Adiciona uma acima — depois lança as avaliações com peso e nota (deixa a nota em branco se ainda não fez a prova).
  </div>

<script>
  const KEY = 'calc-notas-v1';
  let dados = { materias: [] };

  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);

  async function carregar(){
    try{
      const r = await window.storage.get(KEY, false);
      if(r && r.value) dados = JSON.parse(r.value);
    }catch(e){ dados = { materias: [] }; }
    render();
  }
  async function salvar(){
    try{ await window.storage.set(KEY, JSON.stringify(dados), false); }
    catch(e){ console.error('erro ao salvar', e); }
  }

  function adicionarMateria(){
    const inp = document.getElementById('novaMateria');
    const nome = inp.value.trim();
    if(!nome) return;
    dados.materias.push({ id: uid(), nome, meta: 6.0, avaliacoes: [] });
    inp.value = '';
    salvar(); render();
  }
  function removerMateria(id){
    dados.materias = dados.materias.filter(m => m.id !== id);
    salvar(); render();
  }
  function atualizarMeta(id, valor){
    const m = dados.materias.find(m => m.id === id);
    const v = parseFloat(valor);
    m.meta = isNaN(v) ? 6.0 : v;
    salvar(); render();
  }
  function adicionarAvaliacao(materiaId){
    const nomeEl = document.getElementById('av-nome-' + materiaId);
    const pesoEl = document.getElementById('av-peso-' + materiaId);
    const notaEl = document.getElementById('av-nota-' + materiaId);
    const nome = nomeEl.value.trim() || 'Prova';
    const peso = parseFloat(pesoEl.value);
    const notaRaw = notaEl.value.trim();
    if(isNaN(peso) || peso <= 0) return;
    const nota = notaRaw === '' ? null : parseFloat(notaRaw);
    const m = dados.materias.find(m => m.id === materiaId);
    m.avaliacoes.push({ id: uid(), nome, peso, nota });
    nomeEl.value=''; pesoEl.value=''; notaEl.value='';
    salvar(); render();
  }
  function removerAvaliacao(materiaId, avId){
    const m = dados.materias.find(m => m.id === materiaId);
    m.avaliacoes = m.avaliacoes.filter(a => a.id !== avId);
    salvar(); render();
  }

  function calcular(m){
    const lancadas = m.avaliacoes.filter(a => a.nota !== null);
    const pendentes = m.avaliacoes.filter(a => a.nota === null);
    const pesoTotal = m.avaliacoes.reduce((s,a) => s + a.peso, 0);
    const pesoLancado = lancadas.reduce((s,a) => s + a.peso, 0);
    const pesoPendente = pendentes.reduce((s,a) => s + a.peso, 0);
    const somaLancada = lancadas.reduce((s,a) => s + a.nota * a.peso, 0);

    const mediaAtual = pesoLancado > 0 ? somaLancada / pesoLancado : null;

    let necessaria = null, status = 'neutro';
    if(pesoTotal > 0){
      if(pesoPendente > 0){
        necessaria = (m.meta * pesoTotal - somaLancada) / pesoPendente;
        if(necessaria <= 0) status = 'ok-facil';
        else if(necessaria <= 10) status = 'ok';
        else status = 'impossivel';
      } else if(pesoLancado > 0){
        status = mediaAtual >= m.meta ? 'ok-fechado' : 'fail-fechado';
      }
    }
    return { mediaAtual, necessaria, status, pesoPendente, pesoLancado };
  }

  function render(){
    const lista = document.getElementById('lista');
    const vazio = document.getElementById('vazioMsg');
    if(!dados.materias.length){
      lista.innerHTML = '';
      vazio.style.display = 'block';
      return;
    }
    vazio.style.display = 'none';

    lista.innerHTML = dados.materias.map(m => {
      const r = calcular(m);

      const linhas = m.avaliacoes.map(a => `
        <tr>
          <td class="nome-col">${escapeHtml(a.nome)}</td>
          <td class="peso-col">peso ${a.peso}</td>
          <td class="nota-col">${a.nota === null ? '<span style="color:var(--ink-soft)">--</span>' : a.nota.toFixed(1)}</td>
          <td class="acao-col"><span class="remover" onclick="removerAvaliacao('${m.id}','${a.id}')">&times;</span></td>
        </tr>
      `).join('');

      let mediaPill = `<div class="pill neutro"><div class="pill-label">Média atual</div><div class="pill-valor">--</div></div>`;
      if(r.mediaAtual !== null){
        const cls = r.mediaAtual >= m.meta ? 'ok' : 'no';
        mediaPill = `<div class="pill ${cls}"><div class="pill-label">Média atual</div><div class="pill-valor">${r.mediaAtual.toFixed(1)}</div></div>`;
      }

      let necPill = `<div class="pill neutro"><div class="pill-label">Falta prova</div><div class="pill-valor">--</div></div>`;
      if(r.status === 'ok-facil'){
        necPill = `<div class="pill ok"><div class="pill-label">Precisa tirar</div><div class="pill-valor">garantido</div></div>`;
      } else if(r.status === 'ok'){
        necPill = `<div class="pill ok"><div class="pill-label">Precisa tirar</div><div class="pill-valor">${r.necessaria.toFixed(1)}</div></div>`;
      } else if(r.status === 'impossivel'){
        necPill = `<div class="pill warn"><div class="pill-label">Precisa tirar</div><div class="pill-valor">${r.necessaria.toFixed(1)} (não dá)</div></div>`;
      } else if(r.status === 'ok-fechado'){
        necPill = `<div class="pill ok"><div class="pill-label">Resultado</div><div class="pill-valor">aprovado</div></div>`;
      } else if(r.status === 'fail-fechado'){
        necPill = `<div class="pill no"><div class="pill-label">Resultado</div><div class="pill-valor">abaixo da meta</div></div>`;
      }

      return `
        <div class="materia">
          <div class="materia-header">
            <div class="materia-nome">${escapeHtml(m.nome)}</div>
          </div>
          <div class="meta-row">
            META DE MÉDIA
            <input type="number" step="0.1" value="${m.meta}" onchange="atualizarMeta('${m.id}', this.value)">
          </div>

          ${m.avaliacoes.length ? `
          <table>
            <thead><tr><th>Avaliação</th><th>Peso</th><th>Nota</th><th></th></tr></thead>
            <tbody>${linhas}</tbody>
          </table>` : `<div class="hint">Nenhuma avaliação lançada ainda.</div>`}

          <div class="add-avaliacao">
            <input type="text" id="av-nome-${m.id}" placeholder="ex: Prova 1">
            <input type="number" id="av-peso-${m.id}" placeholder="peso" step="0.5" min="0.1">
            <input type="number" id="av-nota-${m.id}" placeholder="nota" step="0.1" min="0" max="10">
            <button onclick="adicionarAvaliacao('${m.id}')">+</button>
          </div>
          <div class="hint">nota em branco = prova pendente, entra no cálculo do que falta</div>

          <div class="resultado" style="margin-top:12px;">
            ${mediaPill}
            ${necPill}
          </div>

          <button class="icon-btn del-materia" onclick="removerMateria('${m.id}')">remover matéria</button>
        </div>
      `;
    }).join('');
  }

  function escapeHtml(str){
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  document.getElementById('novaMateria').addEventListener('keydown', e => { if(e.key==='Enter') adicionarMateria(); });

  carregar();
</script>
</body>
</html>
